name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish screenshots to the "screenshots" branch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      BUNDLE_ID: com.rainmaker07.scoreline
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build (unsigned, device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Scoreline.xcodeproj \
            -target Scoreline \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*(deprecated|will never)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show compiler errors
        if: failure()
        working-directory: ios
        run: grep -n -B2 -A6 "error:" build.log | head -300 || true

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Scoreline.app Payload/
          zip -qry Scoreline-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Scoreline-unsigned-ipa
          path: ios/Scoreline-unsigned.ipa
          retention-days: 14

      # ---------------------------------------------------------------
      # Simulator: data source checks and screenshots on an iPhone 13
      # ---------------------------------------------------------------

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Scoreline.xcodeproj \
            -target Scoreline \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$PWD/build-sim" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build | tee build-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Boot iPhone 13 simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          echo "Runtime: $RUNTIME"
          UDID=$(xcrun simctl create "iPhone 13 Scoreline" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" ios/build-sim/Debug-iphonesimulator/Scoreline.app

      - name: Data source checks
        id: checks
        run: |
          mkdir -p shots
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -runDataChecks YES -AppleLocale de_DE
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          for i in $(seq 1 120); do
            [ -f "$DATA/Documents/data-checks.json" ] && break
            sleep 3
          done
          if [ ! -f "$DATA/Documents/data-checks.json" ]; then
            echo '[{"group":"CI","name":"Data checks","ok":false,"detail":"did not finish in 6 minutes","seconds":360}]' > shots/data-checks.json
          else
            cp "$DATA/Documents/data-checks.json" shots/data-checks.json
          fi
          python3 - <<'EOF'
          import json, os
          results = json.load(open("shots/data-checks.json"))
          failed = [r for r in results if not r["ok"]]
          lines = [f"## Data source checks: {len(results) - len(failed)}/{len(results)} passed", "",
                   "| | Source | Check | Result |", "|---|---|---|---|"]
          for r in results:
              lines.append(f"| {'✅' if r['ok'] else '❌'} | {r['group']} | {r['name']} | {r['detail'].replace('|', '/')} |")
          text = "\n".join(lines) + "\n"
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text)
          open("shots/data-checks.md", "w").write(text)
          print(text)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"failed={len(failed)}\n")
          EOF
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

      - name: Screenshots
        run: |
          shot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -AppleLocale de_DE "$@" > /dev/null
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot --type=png "shots/$name.png" > /dev/null 2>&1
            sips --resampleWidth 780 "shots/$name.png" > /dev/null
            echo "shot $name"
          }
          shot 01-home              14 -selectedLeague home
          shot 02-league-menu       8  -selectedLeague home -shotMenu YES
          shot 03-nba               10 -selectedLeague nba
          shot 04-mlb               10 -selectedLeague mlb
          shot 05-bbl               10 -selectedLeague bbl
          shot 06-premier-league    10 -selectedLeague epl
          shot 07-bundesliga        10 -selectedLeague bl1
          shot 08-champions-league  10 -selectedLeague ucl
          shot 09-dfb-pokal         12 -selectedLeague dfb
          shot 10-premiership-rugby 10 -selectedLeague prem
          shot 11-nba-game          14 -selectedLeague nba -shotRoute game:nba
          shot 12-nba-game-box      14 -selectedLeague nba -shotRoute game:nba -shotGameTab "Box Score"
          shot 13-football-events   14 -selectedLeague epl -shotRoute game:epl
          shot 14-football-lineups  14 -selectedLeague epl -shotRoute game:epl -shotGameTab Lineups
          shot 15-football-stats    14 -selectedLeague epl -shotRoute game:epl -shotGameTab Stats
          shot 16-nba-team          12 -selectedLeague nba -shotRoute team:nba:13
          shot 17-football-team     12 -selectedLeague epl -shotRoute team:epl:359
          shot 18-nba-player        12 -selectedLeague nba -shotRoute player:nba:1966
          shot 19-nba-cup           14 -selectedLeague nba -shotRoute nbaCup
          shot 20-atp               14 -selectedLeague atp
          shot 21-atp-rankings      12 -selectedLeague atp -shotTennisTab 1
          shot 22-atp-tournament    16 -selectedLeague atp -shotRoute "tournament:Australian"
          shot 23-davis-cup         16 -selectedLeague atp -shotRoute "tournament:Davis"
          shot 24-cycling           14 -selectedLeague cycling
          shot 25-cycling-race      16 -selectedLeague cycling -shotRoute "race:Lombardia"
          shot 26-rider             16 -selectedLeague cycling -shotRoute "rider:Tadej Pogačar"
          shot 27-settings          6  -selectedLeague home -shotSettings YES

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14

      - name: Publish screenshots to the "screenshots" branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          {
            echo "# Screenshots"
            echo
            echo "iPhone 13 simulator, commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            [ -f data-checks.md ] && cat data-checks.md
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "<img src=\"$f\" width=\"300\">"; echo; done
          } > README.md
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

      - name: Fail if a data source check failed
        if: steps.checks.outputs.failed != '0'
        run: |
          echo "::error::${{ steps.checks.outputs.failed }} data source check(s) failed. See the job summary."
          exit 1
